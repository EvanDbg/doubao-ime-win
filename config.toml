# Doubao Voice Input - Configuration File
# 豆包语音输入配置文件

[general]
# 开机自启动
auto_start = false
# 语言
language = "zh-CN"

[hotkey]
# 热键模式: "combo" (组合键) 或 "double_tap" (双击)
mode = "double_tap"
# 组合键 (当 mode = "combo" 时生效)
combo_key = "Ctrl+Shift+V"
# 双击键 (当 mode = "double_tap" 时生效)
double_tap_key = "Ctrl"
# 双击间隔 (毫秒)
double_tap_interval = 300

[floating_button]
# 是否显示悬浮按钮
enabled = true
# 悬浮按钮位置 (像素)
position_x = 100
position_y = 100

[asr]
# 是否启用 VAD (语音活动检测)
vad_enabled = true
# 字幕识别结果是否保留标点
caption_punctuation = true
# 整句最终结果是否保留标点
sentence_punctuation = true

[ai]
# 启用识别结果的 AI 后处理
enabled = true
# OpenAI 兼容接口地址
endpoint = "https://175.178.193.126:13065/v1/chat/completions"
# 模型名称
model = "qwen2.5-coder-32b-Instruct"
# API Key（保留在本地配置文件中）
api_key = "[REDACTED_SECRET]"
# 请求超时时间（毫秒）
timeout_ms = 8000
